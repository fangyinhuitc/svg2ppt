[package]
name = "svg2ppt"
version = "1.0.0"
edition = "2024"
description = "把 SVG 转成可编辑的 PowerPoint（.pptx）真实矢量形状，而非截图贴图"
license = "MIT"
readme = "README.md"
repository = "https://github.com/fangyinhuitc/svg2ppt"
keywords = ["svg", "pptx", "powerpoint", "ooxml", "converter"]
categories = ["command-line-utilities", "multimedia::images", "office-automation"]
exclude = ["/docs", "/demo", "/.workbuddy"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
office-toolkit = { version = "1", default-features = false, features = ["powerpoint"] }
resvg = "0.48"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
usvg = "0.48"

[dev-dependencies]
zip = "9.0.0"
