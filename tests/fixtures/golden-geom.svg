<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- 金样专用：纯几何，不含文本与光栅降级特性。
       字形轮廓依赖系统字体，三平台必然不同，因此文本一律不进金样。 -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- 实色矩形 + 描边 -->
  <rect x="40" y="30" width="200" height="120" rx="16" fill="#22c55e" stroke="#166534" stroke-width="3"/>

  <!-- 椭圆 -->
  <ellipse cx="360" cy="90" rx="70" ry="45" fill="url(#g1)"/>

  <!-- 三次贝塞尔路径 -->
  <path d="M 480 40 C 520 10 580 70 560 120 C 545 155 505 160 495 130 Z" fill="#f59e0b"/>

  <!-- 二次贝塞尔（验证升阶为三次） -->
  <path d="M 60 220 Q 120 170 180 220 T 300 220" fill="none" stroke="#7c3aed" stroke-width="4"/>

  <!-- 带旋转与缩放的分组 -->
  <g transform="translate(420 250) rotate(30) scale(1.2)" opacity="0.75">
    <rect x="-50" y="-30" width="100" height="60" fill="#0ea5e9"/>
  </g>

  <!-- 虚线描边 -->
  <rect x="40" y="270" width="160" height="60" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="8 4 2 4"/>
</svg>
