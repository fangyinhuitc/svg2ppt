name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 让 panic 直接 abort，日志更干净，也让测试失败更早暴露
  RUST_BACKTRACE: 1

jobs:
  check:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不要取消其它平台 —— 跨平台差异正是这里要发现的东西
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: 固定到 stable
        run: rustup default stable

      - uses: Swatinem/rust-cache@v2

      # fixtures 里有中文文本（PingFang SC / Noto Sans CJK SC / Microsoft YaHei
      # 回退链），usvg 至少要能命中其中一个 —— Linux runner 默认没有中文字体。
      # 注意：Linux 上 fontdb **不解析通用族**（sans-serif 也算），unresolved 时
      # 整段文本会被丢掉，所以字体列表里必须有该平台真实存在的族名。
      # Windows runner 自带 Microsoft YaHei；macOS 自带 PingFang SC。
      - name: 安装中文字体（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 构建
        run: cargo build --all-targets --verbose

      - name: 测试
        run: cargo test --verbose

      - name: Clippy（警告即失败）
        run: cargo clippy --all-targets -- -D warnings

      - name: 格式检查
        run: cargo fmt --all --check
